name: Apply daily updates
# The scheduled Nirnay Daily tasks drop new editions into inbox/.
# This merges them into data/ (with the archive rules), commits, and rebuilds the site.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
  schedule:
    - cron: "35 18 * * *"   # 00:05 IST daily: publishes anything waiting for its date (e.g. the Monthly Journal on the 1st)
    - cron: "40 7 * * *"    # 13:10 IST: every new Supreme Court judgment from the Court's own "Latest Judgments" list
    - cron: "40 13 * * *"   # 19:10 IST: same (most judgments are uploaded in the evening)
    - cron: "40 16 * * *"   # 22:10 IST: same
permissions:
  contents: write
  pages: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install PDF text tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils && (pip install -q --break-system-packages reportlab img2pdf || pip install -q reportlab img2pdf)
      - name: Queue every new Supreme Court judgment (official sci.gov.in list)
        run: python3 tools/sci_latest.py
      - name: Apply inbox files
        env:
          NIRNAY_PUBLIC_PDFS: "1"   # save the Court's own PDF of each new judgment for free download
        run: python3 tools/ingest.py
      - name: Make downloadable PDFs for any new judgments
        run: python3 tools/make_pdfs.py
      - name: Commit
        run: |
          git config user.name "Nirnay Daily"
          git config user.email "nirnaydaily@users.noreply.github.com"
          git add -A data judgments inbox journal
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Apply daily updates $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          ok=0; for i in 1 2 3; do if git pull --rebase -q -X theirs origin main && git push -q origin main; then ok=1; break; fi; git rebase --abort 2>/dev/null; sleep 5; done
          [ "$ok" = 1 ] || { echo "push failed"; exit 1; }
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request not accepted (the site may rebuild on its own)"
