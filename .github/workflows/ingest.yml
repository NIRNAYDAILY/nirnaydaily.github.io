name: Apply daily updates
# The scheduled Nirnay Daily tasks drop new editions into inbox/.
# This merges them into data/ (with the archive rules), commits, and rebuilds the site.
on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF text tool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Apply inbox files
        run: python3 tools/ingest.py
      - name: Commit
        run: |
          git config user.name "Nirnay Daily"
          git config user.email "nirnaydaily@users.noreply.github.com"
          git add -A data judgments inbox
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Apply daily updates $(TZ=Asia/Kolkata date '+%d %b %Y %H:%M IST')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
      - name: Rebuild the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request not accepted (the site may rebuild on its own)"
